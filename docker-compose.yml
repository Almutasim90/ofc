services:
  api:
    container_name: lolat-api
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      SUPABASE_DB_CONNECTION: ${SUPABASE_DB_CONNECTION}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-POS.API}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-POS.Client}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_ALERT_RECIPIENTS: ${SMTP_ALERT_RECIPIENTS:-}
      RUN_MIGRATIONS_ON_STARTUP: ${RUN_MIGRATIONS_ON_STARTUP:-true}
      DATA_PROTECTION_KEYS_PATH: /keys
    expose:
      - "8080"
    volumes:
      - api_uploads:/app/wwwroot/uploads
      - api_keys:/keys

  web:
    container_name: lolat-web
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
    restart: unless-stopped
    depends_on:
      - api
    expose:
      - "80"

volumes:
  api_uploads:
  api_keys:
