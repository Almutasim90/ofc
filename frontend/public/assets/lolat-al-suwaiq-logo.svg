<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title description">
  <title id="title">شعار أو إف سي</title>
  <desc id="description">شعار OFC ثنائي اللغة</desc>
  <defs>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#2b1710" flood-opacity=".24"/>
    </filter>
    <linearGradient id="tea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2aa31"/>
      <stop offset="1" stop-color="#b95f16"/>
    </linearGradient>
  </defs>

  <g filter="url(#soft-shadow)">
    <!-- Arabic wordmark -->
    <text x="600" y="170" direction="rtl" unicode-bidi="bidi-override" text-anchor="middle"
      font-family="Cairo, Tajawal, Arial, sans-serif" font-size="146" font-weight="800"
      fill="#e32619" stroke="#ffd829" stroke-width="15" stroke-linejoin="round" paint-order="stroke fill">
      أو إف سي
    </text>

    <!-- Tea cup mark, positioned as a visual separator -->
    <g transform="translate(509 215)" stroke="#ffd829" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
      <path d="M13 13h126v42c0 42-29 73-66 73H64C28 128 13 98 13 55V13Z" fill="#fff7d0"/>
      <path d="M139 30h17c27 0 35 42 9 55-8 4-17 4-27 4" fill="none"/>
      <path d="M27 31c26 18 69 18 99 0" fill="none" stroke="#e32619"/>
      <path d="M31 42c27 15 66 15 94 0v20c0 30-21 51-51 51H64c-24 0-37-21-37-51Z" fill="url(#tea)" stroke="none"/>
      <path d="M53-6c0-14 14-14 14-28M88-6c0-14 14-14 14-28" fill="none" stroke="#e32619" stroke-width="8"/>
    </g>

    <!-- Cafe label -->
    <g transform="translate(600 385)">
      <path d="M-138 0H-38M38 0h100" stroke="#e32619" stroke-width="5" stroke-linecap="round"/>
      <text x="0" y="12" direction="rtl" text-anchor="middle" font-family="Cairo, Tajawal, Arial, sans-serif"
        font-size="38" font-weight="800" fill="#e32619">مطعم</text>
    </g>

    <!-- English wordmark -->
    <text x="600" y="458" text-anchor="middle" font-family="Cairo, Arial, sans-serif"
      font-size="43" font-weight="800" letter-spacing="7" fill="#e32619">OFC</text>
  </g>
</svg>
