server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Same-origin API proxy. In Dokploy both services share the Compose
    # network, so the browser only talks to lolat.almutasim.site and nginx
    # forwards API requests to the private ASP.NET container.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        client_max_body_size 5m;
    }

    location /uploads/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        client_max_body_size 5m;
    }

    # react-router-dom client-side routing: any path that isn't a real file
    # falls back to index.html instead of 404ing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|woff2?|png|jpe?g|svg|webp|ico)$ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }
}
