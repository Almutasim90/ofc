# FIRST-TIME SETUP ONLY. Certbot can't issue a certificate until nginx is
# already answering HTTP requests for the domain, so this plain-HTTP config
# is what you start with. Once the first certificate exists (see the
# runbook in DEPLOY.md): mv lolat.conf.final.disabled lolat.conf (overwriting
# this file), then `docker compose exec proxy nginx -s reload`.
server {
    listen 80;
    server_name lolat.almutasim.site;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        client_max_body_size 5m;
    }

    location / {
        proxy_pass http://web:80;
        proxy_set_header Host $host;
    }
}
